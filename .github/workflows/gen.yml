name: Generate repo indexes

on:
  push:
    paths:
      - 'debs/**'
      - 'gen_packages.py'
      - '.github/workflows/gen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Packages / Packages.gz / Release
        run: python3 gen_packages.py
      - name: Commit generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Packages Packages.gz Release
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate package indexes [skip ci]"
            git push
          else
            echo "No index changes to commit."
          fi
